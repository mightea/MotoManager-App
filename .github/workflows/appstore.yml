# Push App Store listing assets (metadata + screenshots) to App Store Connect.
#
# Source of truth is the repo: appstore/metadata/<locale>/*.txt,
# appstore/review/ (App Review notes + demo account), appstore/availability.txt
# (territories) and appstore/screenshots/<locale>/<DISPLAY_TYPE>/*.png — see
# scripts/appstore_assets.py for the exact layout. Screenshots are generated
# locally with scripts/make-screenshots.sh and committed.
#
# Trigger: any push to main touching appstore/** (or the push script), or a
# manual dispatch. The run is idempotent — unchanged screenshot sets are
# skipped by checksum, metadata is simply re-applied.
#
# Auth reuses the TestFlight workflow's App Manager API key from the
# "testflight" environment. NOTE: that environment's deployment-branch policy
# must allow the main branch (Settings → Environments → testflight →
# Deployment branches and tags → add "main"), otherwise this job is rejected
# before it starts.
#
# Metadata is only editable while a version is in an editable state
# (Prepare for Submission, rejected, …). ASC only allows a single editable
# version and only lists builds whose marketing version equals its version
# string, so every run aligns the two: the version string defaults to the
# newest release tag (v* → MARKETING_VERSION of the TestFlight build), the
# editable version is renamed/created to match, and the newest processed
# build of that version is attached — which is also what gives the listing
# its icon. A manual dispatch can override the version (e.g. 1.0.0 after a
# `Release-As` release) or switch the build attachment off.

name: App Store assets

on:
  push:
    branches: [main]
    paths:
      - "appstore/**"
      - "scripts/appstore_assets.py"
      - ".github/workflows/appstore.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to target (default: newest v* tag); the editable version is renamed/created to match"
        required: false
        type: string
      attach_build:
        description: "Attach the newest processed build matching the version"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Log what would change without writing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: appstore-assets
  cancel-in-progress: false

jobs:
  push_assets:
    name: Push metadata & screenshots
    runs-on: ubuntu-latest
    environment: testflight
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            git fetch --tags --force --depth=1 origin
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
            VERSION="${LATEST#v}"
          fi
          [[ -n "$VERSION" ]] || { echo "No v* tag and no version input"; exit 1; }
          echo "Target App Store version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          # App Review contact (required by ASC on every review-detail
          # update; optional secrets — falls back to what ASC already holds)
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Push-triggered runs have no inputs → attach by default.
          ATTACH_BUILD: ${{ github.event_name == 'push' || inputs.attach_build }}
        run: |
          set -euo pipefail
          pip install --quiet PyJWT cryptography
          python3 scripts/appstore_assets.py \
            --version "$VERSION" \
            $([ "${ATTACH_BUILD:-false}" = "true" ] && echo --attach-build) \
            $([ "${DRY_RUN:-false}" = "true" ] && echo --dry-run)
